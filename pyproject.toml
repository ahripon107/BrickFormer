[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brickformer"
version = "0.1.0"
description = "Config-driven library for building LLMs from mixed block types (attention, MLA, Mamba2, Gated DeltaNet, MoE)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aminul Hoque" }]
keywords = ["llm", "transformer", "pytorch", "mamba", "linear-attention", "mixture-of-experts", "hybrid-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.1", "einops>=0.7"]

[project.urls]
Homepage = "https://github.com/ahripon107/BrickFormer"
Repository = "https://github.com/ahripon107/BrickFormer"
Issues = "https://github.com/ahripon107/BrickFormer/issues"

[project.optional-dependencies]
fla = ["flash-linear-attention"]
mamba = ["mamba-ssm", "causal-conv1d"]
hf = ["transformers>=4.40"]
yaml = ["pyyaml"]
dev = ["pytest", "ruff", "pyyaml", "transformers>=4.40"]

[tool.setuptools.packages.find]
include = ["brickformer*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: needs a CUDA device"]
